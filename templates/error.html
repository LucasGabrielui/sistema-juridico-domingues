{% extends "base.html" %}
{% block title %}Erro {{ code }}{% endblock %}
{% block heading %}Não foi possível continuar{% endblock %}
{% block content %}
<section class="card error-card">
  <strong>{{ code }}</strong>
  <h2>Algo saiu do caminho esperado.</h2>
  <p>{{ message }}</p>
  <a class="button primary" href="{{ url_for('dashboard') }}">Voltar ao painel</a>
</section>
{% endblock %}
